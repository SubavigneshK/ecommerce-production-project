<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Stores</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        .product {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My E-Commerce Store</h1>

    <div class="product">
        <h2>Demo Product</h2>

        <p>Price: ₹999</p>

        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
